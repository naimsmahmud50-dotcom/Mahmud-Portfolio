<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#0B0E14"/>
  <circle cx="850" cy="350" r="320" fill="#8B5CF6" fill-opacity="0.12" filter="blur(140px)"/>
  <circle cx="300" cy="550" r="260" fill="#F59E0B" fill-opacity="0.08" filter="blur(120px)"/>
  
  <path d="M0 200H1200M0 400H1200M0 600H1200M300 0V800M600 0V800M900 0V800" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  
  <!-- Autonomous Agent Workflow Visual -->
  <g transform="translate(620, 160)">
