      <text x="24" y="58" fill="#64748B" font-family="sans-serif" font-size="12">Targets Enriched</text>
      
      <rect x="180" y="0" width="160" height="80" rx="12" fill="#141922" stroke="#252D3D"/>
      <text x="204" y="36" fill="#10B981" font-family="sans-serif" font-size="24" font-weight="bold">4.8x</text>
      <text x="204" y="58" fill="#64748B" font-family="sans-serif" font-size="12">Reply Multiplier</text>
