    <rect width="480" height="40" rx="20" fill="#171E2C"/>
    <text x="240" y="25" fill="#8B5CF6" font-family="monospace" font-size="12" text-anchor="middle">Agent_Swarm_Orchestrator v2.4</text>
    
    <!-- Swarm Node 1 -->
