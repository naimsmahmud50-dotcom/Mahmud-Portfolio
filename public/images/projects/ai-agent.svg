    <text x="50" y="330" fill="#8B5CF6" font-family="monospace" font-size="11">&gt; Autonomous agent swarm active: 4 workers</text>
    <text x="50" y="355" fill="#94A3B8" font-family="monospace" font-size="11">&gt; 8,240 verified enterprise leads generated</text>
    <text x="50" y="380" fill="#10B981" font-family="monospace" font-size="11">&gt; Average outbound positive reply: 4.8x benchmark</text>
    <text x="50" y="405" fill="#F59E0B" font-family="monospace" font-size="11">&gt; Human-in-loop approval queue: 0 pending</text>
