  <!-- Editorial Info -->
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="150" height="32" rx="16" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-opacity="0.4"/>
    <text x="75" y="21" fill="#A78BFA" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PYTHON · LANGCHAIN</text>
    
    <text x="0" y="100" fill="#FFFFFF" font-family="sans-serif" font-size="44" font-weight="800" letter-spacing="-1">AI Outbound Agent</text>
    <text x="0" y="145" fill="#94A3B8" font-family="sans-serif" font-size="20" font-weight="400">Autonomous Prospecting &amp; Synthesis Swarm</text>
    
    <g transform="translate(0, 220)">
