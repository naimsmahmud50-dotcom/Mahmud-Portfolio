    <text x="290" y="122" fill="#34D399" font-family="monospace" font-size="11">Claude / GPT-4o RAG</text>
    
    <!-- Down Arrow -->
    <path d="M360 140 V200" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Swarm Node 3 -->
    <rect x="270" y="200" width="180" height="70" rx="12" fill="#1A2232" stroke="#F59E0B" stroke-opacity="0.4"/>
    <text x="290" y="230" fill="#F1F5F9" font-family="sans-serif" font-weight="bold" font-size="13">Syntax &amp; Deliverability</text>
    <text x="290" y="252" fill="#FBBF24" font-family="monospace" font-size="11">MX / SMTP Validator</text>
    
    <!-- Telemetry Log -->
