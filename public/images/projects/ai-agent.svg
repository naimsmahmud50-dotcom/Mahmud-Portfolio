    <text x="50" y="100" fill="#F1F5F9" font-family="sans-serif" font-weight="bold" font-size="13">Prospect Scout</text>
    <text x="50" y="122" fill="#A78BFA" font-family="monospace" font-size="11">Playwright Scraping</text>
    
    <!-- Connector Arrow -->
    <path d="M210 105 H270" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Swarm Node 2 -->
    <rect x="270" y="70" width="180" height="70" rx="12" fill="#1A2232" stroke="#10B981" stroke-opacity="0.4"/>
