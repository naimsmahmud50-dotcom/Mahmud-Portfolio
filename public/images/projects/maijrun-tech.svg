      <rect x="195" y="0" width="70" height="28" rx="6" fill="#161F2E" stroke="#252F40"/>
      <text x="230" y="18" fill="#E2E8F0" font-family="monospace" font-size="11" text-anchor="middle">Redis</text>
      
      <rect x="275" y="0" width="90" height="28" rx="6" fill="#161F2E" stroke="#252F40"/>
      <text x="320" y="18" fill="#E2E8F0" font-family="monospace" font-size="11" text-anchor="middle">SSLCommerz</text>
