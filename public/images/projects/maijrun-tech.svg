      <text x="0" y="48" fill="#38BDF8" font-family="monospace" font-size="13">▸ 100% Component Socket Match Rate</text>
      <text x="0" y="76" fill="#38BDF8" font-family="monospace" font-size="13">▸ Sub-Second Medusa Headless TTFB</text>
