<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#0B0E14"/>
  <!-- Ambient Glows -->
  <circle cx="850" cy="350" r="320" fill="#EF4444" fill-opacity="0.1" filter="blur(140px)"/>
  <circle cx="200" cy="300" r="260" fill="#3B82F6" fill-opacity="0.08" filter="blur(120px)"/>
  
  <!-- Subtle Grid -->
  <path d="M0 200H1200M0 400H1200M0 600H1200M300 0V800M600 0V800M900 0V800" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  
  <!-- Terminal Console Window -->
  <g transform="translate(600, 140)">
    <rect width="520" height="520" rx="20" fill="#111620" stroke="#1E293B" stroke-width="3"/>
    <!-- Window Bar -->
    <rect width="520" height="44" rx="20" fill="#161D2B"/>
    <circle cx="28" cy="22" r="6" fill="#EF4444"/>
    <circle cx="48" cy="22" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="22" r="6" fill="#10B981"/>
    <text x="260" y="27" fill="#64748B" font-family="monospace" font-size="12" text-anchor="middle">secure-my-pc-daemon (x64) [ACTIVE]</text>
    
    <!-- Terminal Lines -->
    <g transform="translate(32, 70)" font-family="monospace" font-size="13">
      <text y="20" fill="#38BDF8">$ secure-daemon --watch --heuristic-strict</text>
      <text y="50" fill="#10B981">[OK] Kernel hook established: NTSTATUS 0x00000000</text>
      <text y="80" fill="#94A3B8">[INFO] Real-time filesystem filter driver online</text>
      <text y="110" fill="#94A3B8">[INFO] USB Device insertion watcher polling at 100Hz</text>
      <text y="150" fill="#F59E0B">[WARN] Process PID: 4912 scored anomaly 78/100</text>
      <text y="180" fill="#EF4444">[TRAP] Unauthorized USB Drive detected (VID: 0951, PID: 1666)</text>
      <text y="210" fill="#10B981">[ACTION] Auto-sandboxed to virtual vault in 12ms</text>
      <text y="240" fill="#38BDF8">[STATUS] System state: 100% PROTECTED</text>
      
      <!-- Metrics Graphic inside terminal -->
      <g transform="translate(0, 270)">
        <rect width="456" height="120" rx="10" fill="#0D1117" stroke="#1E293B"/>
        <text x="20" y="32" fill="#64748B" font-size="11">MEMORY FOOTPRINT</text>
        <text x="20" y="60" fill="#FFFFFF" font-size="20" font-weight="bold">14.2 MB RAM</text>
        <text x="20" y="86" fill="#10B981" font-size="11">&lt; 0.5% CPU OVERHEAD</text>
        
        <text x="240" y="32" fill="#64748B" font-size="11">INTERCEPTION LATENCY</text>
        <text x="240" y="60" fill="#38BDF8" font-size="20" font-weight="bold">&lt; 50 ms</text>
        <text x="240" y="86" fill="#64748B" font-size="11">ZERO KERNEL FAULTS</text>
      </g>
    </g>
  </g>

  <!-- Editorial Card -->
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-opacity="0.4"/>
    <text x="70" y="21" fill="#EF4444" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">C# / .NET · RUST</text>
    
    <text x="0" y="100" fill="#FFFFFF" font-family="sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Secure My PC</text>
    <text x="0" y="145" fill="#94A3B8" font-family="sans-serif" font-size="20" font-weight="400">Endpoint Security &amp; Anomaly Watchdog</text>
    
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="160" height="80" rx="12" fill="#141922" stroke="#252D3D"/>
      <text x="24" y="36" fill="#38BDF8" font-family="sans-serif" font-size="24" font-weight="bold">&lt;50ms</text>
      <text x="24" y="58" fill="#64748B" font-family="sans-serif" font-size="12">Threat Intercept</text>
      
      <rect x="180" y="0" width="160" height="80" rx="12" fill="#141922" stroke="#252D3D"/>
      <text x="204" y="36" fill="#10B981" font-family="sans-serif" font-size="24" font-weight="bold">1,200+</text>
      <text x="204" y="58" fill="#64748B" font-family="sans-serif" font-size="12">Downloads</text>
    </g>
  </g>
</svg>
